<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="400" height="60" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g font-family="'JetBrains Mono', 'Segoe UI', monospace, sans-serif">
    <!-- Subtitle / Tag -->
    <rect x="0" y="4" width="75" height="18" rx="4" fill="#0d1117" stroke="#0ea5e9" stroke-width="1" />
    <text x="8" y="16" fill="#00F0FF" font-size="10" font-weight="700" letter-spacing="1">OVERVIEW</text>

    <!-- Main Title -->
    <text x="0" y="46" fill="url(#grad1)" font-size="24" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      The Short Version
    </text>
    <circle cx="230" cy="42" r="3" fill="#00F0FF" />
  </g>
</svg>
