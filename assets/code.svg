    <text x="20" y="234" class="ln">14</text>
    <text x="20" y="252" class="ln">15</text>
    <text x="20" y="270" class="ln">16</text>

    <!-- Code text -->
    <text x="40" y="0"><tspan class="kw">class</tspan> <tspan class="cls">RaushanKumar</tspan> <tspan class="kw">extends</tspan> <tspan class="cls">SoftwareEngineer</tspan> <tspan class="punct">{</tspan></text>
    <text x="40" y="18">  <tspan class="kw">constructor</tspan><tspan class="punct">() {</tspan></text>
    <text x="40" y="36">    <tspan class="kw">super</tspan><tspan class="punct">();</tspan></text>
    <text x="40" y="54">    <tspan class="prop">this</tspan><tspan class="punct">.</tspan><tspan class="prop">name</tspan> <tspan class="op">=</tspan> <tspan class="str">"Raushan Kumar"</tspan><tspan class="punct">;</tspan></text>
    <text x="40" y="72">    <tspan class="prop">this</tspan><tspan class="punct">.</tspan><tspan class="prop">role</tspan> <tspan class="op">=</tspan> <tspan class="str">"Software &amp; AI Systems Engineer"</tspan><tspan class="punct">;</tspan></text>
    <text x="40" y="90">    <tspan class="prop">this</tspan><tspan class="punct">.</tspan><tspan class="prop">focus</tspan> <tspan class="op">=</tspan> <tspan class="punct">[</tspan><tspan class="str">"Backend Architecture"</tspan><tspan class="punct">, </tspan><tspan class="str">"AI Agents"</tspan><tspan class="punct">, </tspan><tspan class="str">"DSA in C++"</tspan><tspan class="punct">];</tspan></text>
    <text x="40" y="108">    <tspan class="prop">this</tspan><tspan class="punct">.</tspan><tspan class="prop">stack</tspan> <tspan class="op">=</tspan> <tspan class="punct">{</tspan></text>
    <text x="40" y="126">      <tspan class="prop">languages</tspan><tspan class="punct">: [</tspan><tspan class="str">"TypeScript"</tspan><tspan class="punct">, </tspan><tspan class="str">"JavaScript"</tspan><tspan class="punct">, </tspan><tspan class="str">"C++"</tspan><tspan class="punct">, </tspan><tspan class="str">"Python"</tspan><tspan class="punct">],</tspan></text>
    <text x="40" y="144">      <tspan class="prop">backend</tspan><tspan class="punct">:   [</tspan><tspan class="str">"Node.js"</tspan><tspan class="punct">, </tspan><tspan class="str">"Express"</tspan><tspan class="punct">, </tspan><tspan class="str">"MongoDB"</tspan><tspan class="punct">, </tspan><tspan class="str">"PostgreSQL"</tspan><tspan class="punct">],</tspan></text>
    <text x="40" y="162">      <tspan class="prop">frontend</tspan><tspan class="punct">:  [</tspan><tspan class="str">"React"</tspan><tspan class="punct">, </tspan><tspan class="str">"Vite"</tspan><tspan class="punct">, </tspan><tspan class="str">"Tailwind CSS"</tspan><tspan class="punct">, </tspan><tspan class="str">"Framer Motion"</tspan><tspan class="punct">],</tspan></text>
    <text x="40" y="180">      <tspan class="prop">ai_infra</tspan><tspan class="punct">:  [</tspan><tspan class="str">"Groq LPU"</tspan><tspan class="punct">, </tspan><tspan class="str">"LiteLLM"</tspan><tspan class="punct">, </tspan><tspan class="str">"Llama-3"</tspan><tspan class="punct">, </tspan><tspan class="str">"FastAPI"</tspan><tspan class="punct">]</tspan></text>
    <text x="40" y="198">    <tspan class="punct">};</tspan></text>
    <text x="40" y="216">  <tspan class="punct">}</tspan></text>
    <text x="40" y="234">  <tspan class="fn">currentFocus</tspan><tspan class="punct">() {</tspan></text>
    <text x="40" y="252">    <tspan class="kw">return</tspan> <tspan class="str">"Contributing to CNCF &amp; shipping production AI systems 🚀"</tspan><tspan class="punct">;</tspan></text>
    <text x="40" y="270">  <tspan class="punct">}</tspan></text>
    <text x="40" y="288"><tspan class="punct">}</tspan></text>
  </g>
